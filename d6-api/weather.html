<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 날씨</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 3rem 1rem; }
  #emoji { font-size: 5rem; }
  #temp { font-size: 3rem; font-weight: bold; }
</style>
</head>
<body>
  <h1>🌤️ 서울 날씨</h1>
  <div id="emoji">…</div>
  <div id="temp">불러오는 중</div>
  <div id="desc"></div>

<script>
  // 🔌 주소의 latitude, longitude를 바꾸면 다른 도시가 나온다 (지금: 서울)
  const url = "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code&timezone=auto";

  // WMO 날씨 코드 → [말, 이모지]
  const codes = {
    0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
    45: ["안개", "🌫️"], 48: ["안개", "🌫️"],
    51: ["이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["이슬비", "🌦️"],
    61: ["비", "🌧️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
    71: ["눈", "❄️"], 73: ["눈", "❄️"], 75: ["강한 눈", "❄️"],
    80: ["소나기", "🌦️"], 81: ["소나기", "🌦️"], 82: ["강한 소나기", "⛈️"],
    95: ["천둥번개", "⛈️"], 96: ["천둥번개", "⛈️"], 99: ["천둥번개", "⛈️"]
  };

  fetch(url)
    .then(r => r.json())
    .then(d => {
      const c = d.current;
      const [text, emoji] = codes[c.weather_code] || ["알 수 없음", "❓"];
      document.getElementById("emoji").textContent = emoji;
      document.getElementById("temp").textContent = c.temperature_2m + "°C";
      document.getElementById("desc").textContent = text;
    })
    .catch(() => { document.getElementById("temp").textContent = "날씨를 불러오지 못했어요"; });
</script>
</body>
</html>
