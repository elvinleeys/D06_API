<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아침 대시보드</title>
<style>
  body { font-family: sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: .8rem; margin-top: 1rem; }
  .big { font-size: 1.4rem; font-weight: bold; margin-top: .3rem; }
  .small { color: #555; font-size: .85rem; }
  img { max-width: 100%; border-radius: 8px; }
  #apibox { margin-top: 2rem; padding: .8rem; border: 1px solid #aaa; border-radius: 8px; font-size: .85rem; word-break: break-all; }
</style>
</head>
<body>
  <h1 id="greeting"></h1>

  <div class="card"><b>🌤️ 서울 날씨 + 미세먼지</b><div id="c1" class="big"></div><div id="t1" class="small"></div></div>
  <div class="card"><b>💱 환율 (원)</b><div id="c2" class="big"></div><div id="t2" class="small"></div></div>
  <div class="card"><b>🎌 다음 공휴일</b><div id="c3" class="big"></div><div id="t3" class="small"></div></div>
  <b>⚡ 오늘의 포켓몬 5마리</b> <span class="small">(하루 동안 같은 5마리)</span>
  <div class="card"><div id="c4_0"></div><div id="t4_0" class="small"></div></div>
  <div class="card"><div id="c4_1"></div><div id="t4_1" class="small"></div></div>
  <div class="card"><div id="c4_2"></div><div id="t4_2" class="small"></div></div>
  <div class="card"><div id="c4_3"></div><div id="t4_3" class="small"></div></div>
  <div class="card"><div id="c4_4"></div><div id="t4_4" class="small"></div></div>

  <div class="small" style="margin-top:1rem">
    출처: Weather data by Open-Meteo.com · Frankfurter(유럽중앙은행 기준 환율, 하루 한 번 발표) · Nager.Date · PokeAPI
  </div>

  <div id="apibox">🔌 이 화면이 쓰는 API<ol id="apilist"></ol></div>

<script>
  const API = {
    weather: "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m&timezone=auto",   // 🔌 카드1 기온 (서울 좌표)
    air: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=37.5665&longitude=126.9780&current=pm10,pm2_5&timezone=auto", // 🔌 카드1 미세먼지
    usd: "https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW",            // 🔌 카드2 1달러
    jpy: "https://api.frankfurter.dev/v1/latest?amount=100&base=JPY&symbols=KRW", // 🔌 카드2 100엔
    holiday: "https://date.nager.at/api/v3/NextPublicHolidays/KR",                // 🔌 카드3 다음 공휴일
    pokemon: "https://pokeapi.co/api/v2/pokemon/"                                 // 🔌 카드4 포켓몬 (뒤에 도감 번호가 붙음)
  };

  // 환경부 기준 [좋음 상한, 보통 상한, 나쁨 상한] (㎍/㎥), 넘으면 매우나쁨
  const LIMITS = { pm10: [30, 80, 150], pm2_5: [15, 35, 75] };
  const GRADES = ["좋음 😀", "보통 🙂", "나쁨 😷", "매우나쁨 🤢"];
  const grade = (k, v) => GRADES[LIMITS[k].filter(m => v > m).length];
  const $ = id => document.getElementById(id);

  // 인사말: 11시 전 아침, 17시 전 점심, 그 뒤 저녁
  const h = new Date().getHours();
  $("greeting").textContent = h < 11 ? "☀️ 좋은 아침이에요!" : h < 17 ? "🍚 점심 맛있게 드세요!" : "🌙 좋은 저녁이에요!";

  // 카드마다 따로 부른다: urls를 모두 받아 render에 넘기고, 실패하면 그 카드만 실패 문구
  async function load(id, urls, render) {
    $("c" + id).textContent = "불러오는 중…";
    $("t" + id).textContent = "";
    urls.forEach(u => $("apilist").insertAdjacentHTML("beforeend",
      `<li>카드${id}: ${u}<br><a href="${u}" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a></li>`));
    try {
      const data = await Promise.all(urls.map(async u => {
        const r = await fetch(u); // 🔌 API 호출
        if (!r.ok) throw new Error(r.status);
        return r.json();
      }));
      render(data);
    } catch {
      $("c" + id).textContent = "불러오지 못했어요";
    }
  }

  load(1, [API.weather, API.air], ([w, a]) => {
    const c = a.current;
    $("c1").innerHTML = `${w.current.temperature_2m}°C<br>PM10 ${grade("pm10", c.pm10)} · PM2.5 ${grade("pm2_5", c.pm2_5)}`;
    $("t1").textContent = "기준 시각: " + w.current.time;
  });

  load(2, [API.usd, API.jpy], ([u, j]) => {
    $("c2").innerHTML = `1달러 = ${u.rates.KRW.toLocaleString()}원<br>100엔 = ${j.rates.KRW.toLocaleString()}원`;
    $("t2").textContent = `기준 날짜: ${u.date} (하루 한 번 발표되는 기준 환율)`;
  });

  load(3, [API.holiday], ([list]) => {
    const next = list[0];
    const days = Math.round((new Date(next.date) - new Date(new Date().toDateString())) / 86400000);
    $("c3").textContent = `${next.localName} D-${days}`;
    $("t3").textContent = "날짜: " + next.date;
  });

  // 오늘 날짜(YYYYMMDD)를 씨앗으로 1~1025번 중 5마리를 뽑는다: 같은 날엔 항상 같은 5마리
  // shortcut: 도감 총수 1025는 직접 적은 값, PokeAPI에 새 포켓몬이 늘면 고칠 것
  let seed = Number(new Date().toLocaleDateString("sv").replaceAll("-", ""));
  const rand = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const ids = new Set();
  while (ids.size < 5) ids.add(1 + Math.floor(rand() * 1025));

  [...ids].forEach((id, i) => load("4_" + i, [API.pokemon + id], ([p]) => {
    const stat = n => p.stats.find(s => s.stat.name === n).base_stat;
    const img = p.sprites.other["official-artwork"].front_default || p.sprites.front_default;
    $("c4_" + i).innerHTML = `<img src="${img}" alt="${p.name}" width="120"><br>#${p.id} ${p.name}`;
    $("t4_" + i).textContent = `HP ${stat("hp")} · 공격 ${stat("attack")} · 방어 ${stat("defense")} · 속도 ${stat("speed")}`;
  }));
</script>
</body>
</html>
